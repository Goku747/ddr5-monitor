name: Monitor DDR5 RAM prices

on:
  schedule:
    # Peak period: every 30 minutes from 08:00 through 21:30 UTC.
    - cron: "0,30 8-21 * * *"

    # Final peak-period execution at exactly 22:00 UTC.
    - cron: "0 22 * * *"

    # Off-peak period: every 2 hours from 00:00 through 06:00 UTC.
    - cron: "0 0-6/2 * * *"

    # Cover the remaining off-peak hour after 22:00 UTC.
    - cron: "0 23 * * *"

  # Allows manual testing from the Actions page.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ddr5-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements.txt

      - name: Run price and stock monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python bot.py

      - name: Commit generated dashboard and state
        run: |
          if git diff --quiet -- docs/index.html docs/state.json; then
            echo "No dashboard or state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html docs/state.json
          git commit -m "chore: update RAM monitoring dashboard"

          # Incorporate an unlikely concurrent default-branch update before
          # publishing generated files.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
