name: Monitor DDR5 RAM
on:
  schedule:
    - cron: "7,37 8-21 * * *"
    - cron: "7 22 * * *"
    - cron: "7 0-6/2 * * *"
    - cron: "7 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ddr5-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile bot.py
      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DROP_AMOUNT: "500.00"
        run: python bot.py
      - name: Commit generated data
        if: success()
        run: |
          set -euo pipefail
          git add -- docs/index.html docs/state.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh RAM monitor [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
